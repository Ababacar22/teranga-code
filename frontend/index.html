<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teranga Code — prépare tes entretiens d'ingénieur logiciel en jouant, à travers un voyage au Sénégal." />
    <title>Teranga Code</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f2dfb8;
        font-family: 'Segoe UI', system-ui, Roboto, sans-serif;
        color: #2b1d0e;
      }
      @media (prefers-color-scheme: dark) {
        #initial-loader {
          background: #1b140c;
          color: #f2e9d8;
        }
      }
      #initial-loader__dots {
        display: flex;
        gap: 8px;
      }
      #initial-loader__dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00853f;
        animation: initial-loader-bounce 1s infinite ease-in-out;
      }
      #initial-loader__dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #initial-loader__dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes initial-loader-bounce {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div id="initial-loader__dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span>Teranga Code</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
