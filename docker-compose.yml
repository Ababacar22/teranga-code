services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: senegaltech
      POSTGRES_PASSWORD: senegaltech_dev
      POSTGRES_DB: senegaltech
    ports:
      - "5443:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senegaltech"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://senegaltech:senegaltech_dev@postgres:5432/senegaltech?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant — définis-le dans un fichier .env à la racine}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5185}
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5185:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
